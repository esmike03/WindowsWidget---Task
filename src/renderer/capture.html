<!doctype html>
<html lang="en" data-theme="light" data-layout="below">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; font-src 'self' file:; style-src 'self'; script-src 'self';" />
<title>Sidenote Capture</title>
<link rel="stylesheet" href="capture.css" />
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="c-bolt" viewBox="0 0 24 24"><path d="M13 3 5 13.5h6L10.5 21 19 10.5h-6z"/></symbol>
    <symbol id="c-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="c-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></symbol>
    <symbol id="c-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></symbol>
    <symbol id="c-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="c-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></symbol>
  </defs>
</svg>

<main id="shell">
  <div id="bar">
    <span id="grip" title="Drag to move"><svg><use href="#c-grip"/></svg></span>

    <!-- Which bucket the line lands in. Auto-picks from whether a time was
         parsed; click or press Tab to override. -->
    <div class="kind" id="kind" data-on="task">
      <span class="kind-thumb" aria-hidden="true"></span>
      <button type="button" data-kind="task" class="is-on">Task</button>
      <button type="button" data-kind="event">Event</button>
    </div>

    <input id="text" type="text" placeholder="Jot a task or event…" spellcheck="false" maxlength="400" autocomplete="off" />

    <button class="ico ico-add" id="add" type="button" title="Save (Enter)">
      <svg><use href="#c-bolt"/></svg>
    </button>
    <button class="ico" id="close" type="button" title="Hide (Esc)"><svg><use href="#c-x"/></svg></button>
  </div>

  <!-- what pressing Enter will actually create -->
  <section id="hint" hidden>
    <svg class="hint-icon" id="hintIcon"><use href="#c-clock"/></svg>
    <span id="hintText"></span>
  </section>
</main>

<script src="parse.js"></script>
<script src="capture-app.js"></script>
</body>
</html>
